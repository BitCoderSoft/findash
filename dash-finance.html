            '<div class="kpi-grid">' +
            '<div class="kpi-card hero"><span class="kpi-label">Saldo atual</span>' +
            '<span class="kpi-value ' + lucroClasse + '">R$ ' + fmt2(kpis.saldoAtual) + '</span>' +
            '<span class="trend neutral" style="color: var(--color-text);">custo de aquisição: R$ ' + fmt2(kpis.valorInvestido) + '</span></div>' +
            '<div class="kpi-card"><span class="kpi-label">Lucro / Prejuízo</span>' + lucroBloco + '</div>' +
            '<div class="kpi-card"><span class="kpi-label">Rentabilidade</span>' + rentBloco + '</div>' +
            '<div class="kpi-card"><span class="kpi-label">Posições</span><span class="kpi-value">' + kpis.numPosicoes + ' ativos</span><span class="trend neutral">—</span></div>' +
            '</div>' +
            '<div class="panel-grid">' + evolucaoHTML + alocacaoHTML + '</div>' +
            renderRankingsHTML(rankings) +
            '</main></div>' +
            drawerTransacaoHTML(drawerState);
    });
}

function renderPosicoes(user) {
    var grupos = posicoesPorClasse(user.id);
    var tickers = [];
    grupos.forEach(function (g) { g.posicoes.forEach(function (p) { tickers.push(p.ativo.ticker); }); });
    tickers = Array.from(new Set(tickers));

    var promise = tickers.length ? buscarCotacoes(tickers) : Promise.resolve({});
    return promise.then(function (cotacoes) {
        aplicarCotacoes(grupos, cotacoes);
        var destaques = destaquesCarteira(grupos);
        var kpis = calcularKpis(user.id);

        var destaquesHTML;
        if (destaques.avaliadas) {
            function destaqueItem(label, p) {
                var trend = p.lucro ? 'up' : 'down';
                var sinal = p.lucro ? '+' : '';
                return '<div class="destaque-item"><p class="destaque-label">' + label + '</p>' +
                    '<p class="destaque-value"><a href="#/ativo/' + encodeURIComponent(p.ativo.ticker) + '" class="ativo-link">' + escapeHtml(p.ativo.ticker) + '</a></p>' +
                    '<p class="destaque-sub"><span class="trend ' + trend + '">' + sinal + fmt2(p.rentabilidadePercentual) + '%</span></p></div>';
            }
            destaquesHTML = '<div class="destaques-grid">' + destaqueItem('Melhor posição', destaques.melhor) + destaqueItem('Pior posição', destaques.pior) + '</div>';
        } else {
            destaquesHTML = '<div class="destaques-grid">' +
                '<div class="destaque-item"><p class="destaque-label">Melhor posição</p><p class="destaque-value">—</p><p class="destaque-sub">requer cotação de mercado</p></div>' +
                '<div class="destaque-item"><p class="destaque-label">Pior posição</p><p class="destaque-value">—</p><p class="destaque-sub">requer cotação de mercado</p></div>' +
                '</div>';
        }

        var noLucroHTML;
        if (destaques.avaliadas) {
            noLucroHTML = '<p class="destaque-value">' + destaques.noLucro + ' de ' + destaques.avaliadas + '</p>' +
                '<div class="progress-bar"><div class="progress-bar-fill" style="width: ' + destaques.percentualNoLucro + '%; background: var(--color-success);"></div></div>' +
                (destaques.semCotacao ? '<p class="destaque-sub">' + destaques.semCotacao + ' posição(ões) sem cotação disponível</p>' : '');
        } else {
            noLucroHTML = '<p class="destaque-value">— de ' + kpis.numPosicoes + '</p>' +
                '<div class="progress-bar"><div class="progress-bar-fill" style="width: 0%;"></div></div>' +
                '<p class="destaque-sub">requer cotação de mercado</p>';
        }

        var gruposHTML;
        if (grupos.length) {
            gruposHTML = grupos.map(function (grupo) {
                var linhas = grupo.posicoes.map(function (p) {
                    var logo;
                    if (p.cotacao && p.cotacao.logoUrl) {
                        var fallback = escapeHtml(p.ativo.ticker.slice(0, 2));
                        logo = '<img src="' + escapeHtml(p.cotacao.logoUrl) + '" alt="" class="ativo-logo" loading="lazy" data-fallback="' + fallback + '" ' +
                            'onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'ativo-logo ativo-logo-fallback\',textContent:this.dataset.fallback}))">';
                    } else {
                        logo = '<span class="ativo-logo ativo-logo-fallback">' + escapeHtml(p.ativo.ticker.slice(0, 2)) + '</span>';
                    }
                    var precoAtualCell = p.precoAtual ? 'R$ ' + fmt2(p.precoAtual) : '—';
                    var rentCell = p.rentabilidadePercentual !== null
                        ? '<span class="trend ' + (p.lucro ? 'up' : 'down') + '">' + (p.lucro ? '+' : '') + fmt2(p.rentabilidadePercentual) + '%</span>'
                        : '<span class="trend neutral">—</span>';
                    return '<tr><td><a href="#/ativo/' + encodeURIComponent(p.ativo.ticker) + '" class="ativo-cell ativo-link">' + logo + escapeHtml(p.ativo.ticker) + '</a></td>' +
                        '<td>' + formatQuantidade(p.quantidade, p.ativo.classe) + '</td>' +
                        '<td>R$ ' + fmt2(p.precoMedio) + '</td>' +
                        '<td>' + precoAtualCell + '</td>' +
                        '<td>' + rentCell + '</td>' +
                        '<td>R$ ' + fmt2(p.valorInvestido) + '</td>' +
                        '<td>' + fmt1(p.percentual) + '%</td></tr>';
                }).join('');

                return '<div class="classe-group"><div class="classe-group-header">' +
                    '<div class="classe-group-title"><span class="color-dot" style="background: ' + grupo.cor + ';"></span>' + grupo.label +
                    ' <span class="classe-group-count">(' + grupo.posicoes.length + ')</span></div>' +
                    '<div class="classe-group-stats"><span>Valor total <strong>R$ ' + fmt2(grupo.valorTotal) + '</strong></span>' +
                    '<span>% da carteira <strong>' + fmt1(grupo.percentual) + '%</strong></span></div></div>' +
                    '<div class="classe-group-table-scroll"><table class="table"><thead><tr>' +
                    '<th>Ativo</th><th>Quantidade</th><th>Preço médio</th><th>Preço atual</th><th>Rentabilidade</th><th>Valor investido</th><th>% da carteira</th>' +
                    '</tr></thead><tbody>' + linhas + '</tbody></table></div></div>';
            }).join('');
        } else {
            gruposHTML = '<div class="empty-panel">' + emptyIllustrationDonut() +
                '<p class="empty-title">Nenhuma posição em aberto</p>' +
                '<p class="empty-text">Assim que você registrar uma compra em "Lançamentos", ela aparece aqui com preço médio e valor investido.</p></div>';
        }

        var corpo = grupos.length
            ? '<div class="summary-grid">' +
              '<div class="summary-card"><span class="summary-card-title">Valor investido</span><p class="kpi-value" style="margin-top: 10px;">R$ ' + fmt2(kpis.valorInvestido) + '</p></div>' +
              '<div class="summary-card"><div class="summary-card-header"><span class="summary-card-title">Destaques da carteira</span>' +
              '<button type="button" class="info-button" data-drawer-open="drawer-info-rentabilidade" aria-label="Como calculamos os destaques">?</button></div>' + destaquesHTML + '</div>' +
              '<div class="summary-card"><div class="summary-card-header"><span class="summary-card-title">Posições no lucro</span>' +
              '<button type="button" class="info-button" data-drawer-open="drawer-info-rentabilidade" aria-label="Como calculamos isso">?</button></div>' + noLucroHTML + '</div>' +
              '</div>' + gruposHTML
            : gruposHTML;

        return '' +
            '<div class="app-shell">' + topbarHTML('/posicoes') +
            '<main class="page-content">' +
            '<div class="page-heading"><h1>Posições</h1><p class="page-subtitle">Preço médio e valor investido por ativo, agrupado por classe.</p></div>' +
            corpo +
            '</main></div>' +
            drawerTransacaoHTML(drawerState) +
            '<div class="drawer-overlay"></div>' +
            '<div id="drawer-info-rentabilidade" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-info-title">' +
            '<div class="drawer-header"><h2 id="drawer-info-title">Como calculamos lucro e prejuízo</h2>' +
            '<button type="button" class="drawer-close" data-drawer-close aria-label="Fechar">&times;</button></div>' +
            '<div class="drawer-body">' +
            '<p style="margin-bottom: 16px;">A cotação vem da <strong>brapi.dev</strong> e cobre ações e FIIs. ' +
            'Criptomoeda e renda fixa ainda aparecem como "—" aqui — essa API é só de ativos da B3, não tem fonte de cotação plugada pra essas classes ainda.</p>' +
            '<p style="margin-bottom: 16px;"><strong>Rentabilidade de uma posição</strong> = (preço atual − preço médio) ÷ preço médio. Positiva é lucro, negativa é prejuízo.</p>' +
            '<p style="margin-bottom: 16px;"><strong>Melhor posição / Pior posição</strong> = as posições com a maior e a menor rentabilidade entre tudo que você tem em carteira hoje.</p>' +
            '<p><strong>Posições no lucro</strong> = quantas das suas posições com cotação disponível têm rentabilidade positiva neste momento, sobre o total de posições avaliadas (não conta cripto/renda fixa, que ainda não têm cotação).</p>' +
            '</div><div class="drawer-footer"><button type="button" class="button ghost" data-drawer-close>Fechar</button></div></div>';
    });
}

function renderTransacoes(user) {
    var db = loadDB();
    var transacoes = db.transacoes
        .filter(function (t) { return t.usuarioId === user.id; })
        .slice()
        .sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; }); // -data (mais recente primeiro)

    var corpo;
    if (transacoes.length) {
        var linhas = transacoes.map(function (t) {
            var ativo = db.ativos.filter(function (a) { return a.id === t.ativoId; })[0];
            var valorTotal = t.quantidade * t.precoUnitario + t.corretagemTaxas;
            var dataFmt = t.data.split('-').reverse().join('/');
            var tipoTag = t.tipo === 'COMPRA' ? '<span class="trend up">Compra</span>' : '<span class="trend down">Venda</span>';
            return '<tr><td>' + dataFmt + '</td><td><a href="#/ativo/' + encodeURIComponent(ativo.ticker) + '" class="ativo-link">' + escapeHtml(ativo.ticker) + '</a></td><td>' + CLASSES[ativo.classe] + '</td>' +
                '<td>' + tipoTag + '</td><td>' + formatQuantidade(t.quantidade, ativo.classe) + '</td>' +
                '<td>R$ ' + fmt2(t.precoUnitario) + '</td><td>R$ ' + fmt2(t.corretagemTaxas) + '</td><td>R$ ' + fmt2(valorTotal) + '</td>' +
                '<td class="table-actions">' +
                '<button type="button" class="button ghost small" data-editar-id="' + t.id + '">Editar</button>' +
                '<button type="button" class="button ghost small" data-excluir-id="' + t.id + '">Excluir</button>' +
                '</td></tr>';
        }).join('');

        corpo = '<div class="table-wrap"><table class="table"><thead><tr>' +
            '<th>Data</th><th>Ativo</th><th>Classe</th><th>Tipo</th><th>Quantidade</th><th>Preço unitário</th><th>Taxas</th><th>Valor total</th><th>Ações</th>' +
            '</tr></thead><tbody>' + linhas + '</tbody></table></div>';
    } else {
        corpo = '<div class="empty-panel">' + emptyIllustrationBars() +
            '<p class="empty-title">Nenhuma transação registrada ainda</p>' +
            '<p class="empty-text">Clique em "+ Novo lançamento" para registrar sua primeira compra ou venda.</p></div>';
    }

    return '' +
        '<div class="app-shell">' + topbarHTML('/transacoes') +
        '<main class="page-content">' +
        '<div class="page-heading"><h1>Lançamentos</h1><p class="page-subtitle">Histórico de compras e vendas registradas.</p></div>' +
        corpo +
        '</main></div>' +
        drawerTransacaoHTML(drawerState);
}

// Página de detalhe do ativo — genérica, mesma estrutura pra qualquer ticker
// (não é uma tela por ativo, é uma tela parametrizada por `ticker`). Busca
// cotação (preço do dia + variação vs. fechamento anterior, já pronta em
// buscarCotacoes) e histórico de 30 pregões em paralelo.
function renderAtivoDetalhe(user, ticker) {
    return Promise.all([buscarCotacoes([ticker]), buscarHistorico(ticker, '1mo', '1d')]).then(function (resultados) {
        var cot = resultados[0][ticker] || null;
        var historico = resultados[1];

        var db = loadDB();
        var ativoLocal = db.ativos.filter(function (a) { return a.ticker === ticker; })[0];
        var corLinha = CORES_CLASSE[ativoLocal ? ativoLocal.classe : 'ACAO'];
        var nome = cot ? cot.nome : ticker;

        var logoHtml;
        if (cot && cot.logoUrl) {
            var fallback = escapeHtml(ticker.slice(0, 2));
            logoHtml = '<img src="' + escapeHtml(cot.logoUrl) + '" alt="" class="ativo-logo-lg" loading="lazy" data-fallback="' + fallback + '" ' +
                'onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'ativo-logo-lg ativo-logo-lg-fallback\',textContent:this.dataset.fallback}))">';
        } else {
            logoHtml = '<span class="ativo-logo-lg ativo-logo-lg-fallback">' + escapeHtml(ticker.slice(0, 2)) + '</span>';
        }

        var precoBlocoHtml;
        if (cot) {
            var alta = cot.variacao >= 0;
            precoBlocoHtml = '<span class="ativo-preco-atual">R$ ' + fmt2(cot.precoAtual) + '</span>' +
                '<span class="trend ' + (alta ? 'up' : 'down') + '">' + (alta ? '+' : '') + fmt2(cot.variacao) +
                ' (' + (alta ? '+' : '') + fmt2(cot.variacaoPercentual) + '%) hoje</span>';
        } else {
            precoBlocoHtml = '<span class="ativo-preco-atual">—</span><span class="trend neutral">cotação indisponível</span>';
        }

        var graficoHtml;
        if (historico.length >= 2) {
            graficoHtml = '<div class="empty-panel chart-panel" style="margin-top:24px;">' +
                '<p class="empty-title chart-panel-title">Histórico de preço — últimos ' + historico.length + ' pregões</p>' +
                montarGraficoHistoricoHTML(historico, corLinha) +
                '</div>';
        } else {
            graficoHtml = '<div class="empty-panel" style="margin-top:24px;">' + emptyIllustrationBars() +
                '<p class="empty-title">Sem histórico suficiente</p>' +
                '<p class="empty-text">Não consegui pontos de preço suficientes da brapi pra desenhar o gráfico agora.</p></div>';
        }

        return '' +
            '<div class="app-shell">' + topbarHTML(null) +
            '<main class="page-content">' +
            '<a href="#/posicoes" class="back-link">&larr; Posições</a>' +
            '<div class="ativo-header">' + logoHtml +
            '<div class="ativo-header-info"><h1>' + escapeHtml(ticker) + '</h1><p class="page-subtitle">' + escapeHtml(nome) + '</p></div>' +
            '<div class="ativo-header-preco">' + precoBlocoHtml + '</div>' +
            '</div>' +
            graficoHtml +
            '</main></div>' +
            drawerTransacaoHTML(drawerState);
    });
}

/* =================================================================
   ROTEAMENTO
   ================================================================= */

var loginError = null;
var registerErrors = null;
var registerValues = null;

function renderCurrentRoute() {
    var user = currentUser();
    var hash = location.hash.replace('#', '') || (user ? '/dashboard' : '/login');

    if (!user && hash !== '/login' && hash !== '/register') { location.hash = '/login'; return; }
    if (user && (hash === '/login' || hash === '/register')) { location.hash = '/dashboard'; return; }

    var app = document.getElementById('app');

    if (hash === '/login') {
        document.title = 'Login - Dash Finance';
        app.innerHTML = renderLogin(loginError);
        loginError = null;
        return;
    }
    if (hash === '/register') {
        document.title = 'Cadastrar - Dash Finance';
        app.innerHTML = renderRegister(registerErrors, registerValues);
        registerErrors = null; registerValues = null;
        return;
    }
    if (hash === '/dashboard') {
        document.title = 'Resumo - Dash Finance';
        renderDashboard(user).then(function (html) { app.innerHTML = html; });
        return;
    }
    if (hash === '/posicoes') {
        document.title = 'Posições - Dash Finance';
        renderPosicoes(user).then(function (html) { app.innerHTML = html; });
        return;
    }
    if (hash === '/transacoes') {
        document.title = 'Lançamentos - Dash Finance';
        app.innerHTML = renderTransacoes(user);
        return;
    }
    if (hash.indexOf('/ativo/') === 0) {
        var ticker = decodeURIComponent(hash.slice('/ativo/'.length)).toUpperCase();
        document.title = ticker + ' - Dash Finance';
        renderAtivoDetalhe(user, ticker).then(function (html) {
            app.innerHTML = html;
            wireGraficoHistorico();
        });
        return;
    }
    location.hash = user ? '/dashboard' : '/login';
}

window.addEventListener('hashchange', function () { drawerState = null; renderCurrentRoute(); });

/* =================================================================
   DELEGAÇÃO DE EVENTOS (funciona independente de re-render, porte do
   comportamento de drawer.js + wiring de formulários)
   ================================================================= */

document.addEventListener('click', function (event) {
    var openBtn = event.target.closest('[data-drawer-open]');
    if (openBtn) {
        var drawer = document.getElementById(openBtn.getAttribute('data-drawer-open'));
        if (drawer) {
            var overlay = drawer.previousElementSibling;
            drawer.classList.add('open');
            if (overlay && overlay.classList.contains('drawer-overlay')) overlay.classList.add('open');
            var content = document.querySelector('.page-content');
            if (content) content.inert = true;
            document.body.style.overflow = 'hidden';
            var firstField = drawer.querySelector('input:not([type=hidden]), select, textarea');
            if (firstField) firstField.focus();
        }
        return;
    }

    var closeBtn = event.target.closest('[data-drawer-close]');
    if (closeBtn) {
        var d = closeBtn.closest('.drawer');
        if (d) {
            var ov = d.previousElementSibling;
            d.classList.remove('open');
            if (ov && ov.classList.contains('drawer-overlay')) ov.classList.remove('open');
            var pc = document.querySelector('.page-content');
            if (pc) pc.inert = false;
            document.body.style.overflow = '';
        }
        return;
    }

    if (event.target.classList.contains('drawer-overlay')) {
        var openDrawerEl = document.querySelector('.drawer.open');
        if (openDrawerEl) {
            openDrawerEl.classList.remove('open');
            event.target.classList.remove('open');
            var pc2 = document.querySelector('.page-content');
            if (pc2) pc2.inert = false;
            document.body.style.overflow = '';
        }
        return;
    }

    if (event.target.id === 'btn-logout' || event.target.closest('#btn-logout')) {
        clearSession();
        drawerState = null;
        location.hash = '/login';
        return;
    }

    var editBtn = event.target.closest('[data-editar-id]');
    if (editBtn) {
        var editId = Number(editBtn.getAttribute('data-editar-id'));
        var db = loadDB();
        var t = db.transacoes.filter(function (x) { return x.id === editId; })[0];
        var ativo = db.ativos.filter(function (a) { return a.id === t.ativoId; })[0];
        drawerState = {
            open: true, editId: editId, errors: {},
            values: {
                ticker: ativo.ticker, classeAtivo: ativo.classe, tipo: t.tipo,
                quantidade: t.quantidade, preco_unitario: t.precoUnitario,
                data: t.data, corretagem_taxas: t.corretagemTaxas,
            },
        };
        renderCurrentRoute();
        return;
    }

    var delBtn = event.target.closest('[data-excluir-id]');
    if (delBtn) {
        if (!confirm('Excluir esta transação?')) return;
        excluirTransacao(Number(delBtn.getAttribute('data-excluir-id')));
        showMessage('Transação excluída.', 'success');
        renderCurrentRoute();
        return;
    }

    var rankingTab = event.target.closest('[data-ranking-tab]');
    if (rankingTab) {
        rankingTabAtiva = rankingTab.getAttribute('data-ranking-tab');
        renderCurrentRoute(); // reaproveita o cache dos 2 rankings já buscados — não dispara requisição nova
        return;
    }
});

document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
        var openDrawerEl = document.querySelector('.drawer.open');
        if (openDrawerEl) {
            openDrawerEl.classList.remove('open');
            var ov = openDrawerEl.previousElementSibling;
            if (ov && ov.classList.contains('drawer-overlay')) ov.classList.remove('open');
            var pc = document.querySelector('.page-content');
            if (pc) pc.inert = false;
            document.body.style.overflow = '';
        }
    }
});

document.addEventListener('submit', function (event) {
    var form = event.target;

    if (form.id === 'form-login') {
        event.preventDefault();
        var fd = new FormData(form);
        var user = autenticar(fd.get('username'), fd.get('password'));
        if (user) {
            setSession(user.id);
            drawerState = null;
            location.hash = '/dashboard';
        } else {
            loginError = 'Usuário ou senha inválidos.';
            renderCurrentRoute();
        }
        return;
    }

    if (form.id === 'form-register') {
        event.preventDefault();
        var fdr = new FormData(form);
        var resultado = criarUsuario(fdr.get('username'), fdr.get('email'), fdr.get('password1'), fdr.get('password2'));
        if (resultado.ok) {
            showMessage('Conta criada com sucesso. Faça login.', 'success');
            location.hash = '/login';
        } else {
            registerErrors = resultado.erros;
            registerValues = { username: fdr.get('username'), email: fdr.get('email') };
            renderCurrentRoute();
        }
        return;
    }

    if (form.id === 'form-transacao') {
        event.preventDefault();
        var user2 = currentUser();
        var fdt = new FormData(form);
        var dados = {};
        fdt.forEach(function (value, key) { dados[key] = value; });
        var editId2 = form.getAttribute('data-edit-id') ? Number(form.getAttribute('data-edit-id')) : null;

        var erros = validarTransacao(user2.id, dados, editId2);
        if (Object.keys(erros).length) {
            drawerState = { open: true, editId: editId2, errors: erros, values: dados };
            renderCurrentRoute();
            return;
        }

        salvarTransacao(user2.id, dados, editId2);
        drawerState = null;
        showMessage(editId2 ? 'Transação salva com sucesso.' : 'Transação registrada com sucesso.', 'success');
        renderCurrentRoute();
        return;
    }
});

/* =================================================================
   INIT
   ================================================================= */

renderCurrentRoute();

})();
</script>
